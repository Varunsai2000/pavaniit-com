# Dependency updates. Dependabot opens a pull request; Netlify builds a deploy preview for it.
# Check the preview, then merge. Security fixes arrive as soon as an advisory is published,
# once "Dependabot security updates" is on in the repository's Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Minor and patch releases together in one pull request; major releases one at a time.
      minor-and-patch:
        update-types: [minor, patch]
