<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate with tools/render-images.sh -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:Manrope,sans-serif;color:#0a0a0a}
.wrap{display:grid;grid-template-columns:600px 1fr;gap:16px;padding:16px;height:100%}
.copy{border-radius:22px;background:#f5f5f5;padding:52px 48px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:28px;letter-spacing:-.03em}
.brand svg{width:40px;height:40px}
h1{font-size:58px;font-weight:600;line-height:1.04;letter-spacing:-.035em}
.sub{font-size:21px;color:#45474e;line-height:1.4}
.ex{position:absolute;top:22px;right:24px;border:1px solid rgba(255,255,255,.25);color:#a3a3a3;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.stage{position:relative;border-radius:22px;background:#0a0a0a;display:grid;place-items:center;padding:36px}
.card{width:100%;background:#fff;border-radius:16px;padding:26px 28px;box-shadow:0 12px 32px -14px rgba(5,25,19,.45)}
.head{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;color:#54565e}
.badge{background:#0a0a0a;color:#fff;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.money{font-size:50px;font-weight:700;letter-spacing:-.03em;margin-top:14px}
.ms{font-size:17px;color:#54565e;margin-top:2px}
.rows{margin-top:18px}
.rows div{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #e7e5e1;font-size:17px}
.rows b{font-weight:600}
.due{background:#fff;color:#0a0a0a;box-shadow:inset 0 0 0 1.5px #0a0a0a}
</style></head><body>
<div class="wrap">
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a0a0a"/><path d="M11.5 24V8.5h6a5.25 5.25 0 0 1 0 10.5h-6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Pavani IT</div>
    <h1>Hire your team in India without setting up a company.</h1>
    <p class="sub">Employer of Record, recruitment, payroll and compliance, run in India.</p>
  </div>
  <div class="stage">
    <span class="ex">Example</span>
    <div class="card">
      <div class="head">October payroll<span class="badge">Paid 30 Oct</span></div>
      <p class="money">₹38,42,600</p>
      <p class="ms">Net salaries to 18 people</p>
      <div class="rows">
        <div><span>TDS for October</span><b class="badge">Filed 7 Nov</b></div>
        <div><span>PF and ESI</span><b class="badge">Filed 13 Nov</b></div>
        <div><span>November salaries</span><b class="badge due">Scheduled</b></div>
      </div>
    </div>
  </div>
</div>
</body></html>
