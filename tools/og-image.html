<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Mukta:wght@400;500;600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #161E4E;
    color: #fff;
    font-family: "Mukta", sans-serif;
    position: relative;
  }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 16px;
    font-family: "Anek Latin", sans-serif; font-stretch: 122%; font-weight: 700; font-size: 34px; letter-spacing: -0.01em; }
  .brand svg { width: 52px; height: 52px; }
  h1 { position: absolute; left: 72px; top: 178px; width: 640px;
    font-family: "Anek Latin", sans-serif; font-stretch: 118%; font-weight: 680; font-size: 74px; line-height: 0.98; letter-spacing: -0.015em; }
  .sub { position: absolute; left: 72px; bottom: 64px; width: 600px; font-size: 25px; line-height: 1.4; color: #B3BADB; }

  .cal { position: absolute; left: 790px; top: 96px; width: 400px; height: 600px;
    background: #fff; border-top: 8px solid #F4A51C; border-radius: 14px 0 0 0; padding: 30px 34px; color: #161E4E; }
  .cal h2 { font-family: "Anek Latin", sans-serif; font-stretch: 116%; font-weight: 650; font-size: 30px; }
  .cal p { color: #4A5384; font-size: 19px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(7, 44px); gap: 6px 4px; margin-top: 24px;
    font-family: "Anek Latin", sans-serif; font-size: 19px; }
  .grid span { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
  .dow { color: #9AA1C2; font-size: 15px; height: 26px !important; }
  .past { color: #9AA1C2; }
  .done { background: #1D7A57; color: #fff; font-weight: 650; }
  .due { background: #F4A51C; font-weight: 650; }
  .today { box-shadow: inset 0 0 0 2px #161E4E; font-weight: 700; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#F3F5FA"/><path d="M23 50V15h11.5a10.5 10.5 0 0 1 0 21H23" fill="none" stroke="#161E4E" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>Pavani IT</span>
  </div>
  <h1>Hire, employ, pay and train your team in India.</h1>

  <div class="cal">
    <h2>Every month</h2>
    <p>Payroll and filings, handled</p>
    <div class="grid">
      <span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>
      <span class="past">1</span><span class="past">2</span><span class="past">3</span><span class="past">4</span><span class="past">5</span><span class="past">6</span><span class="done">7</span>
      <span class="past">8</span><span class="past">9</span><span class="past">10</span><span class="past">11</span><span class="today">12</span><span>13</span><span>14</span>
      <span class="due">15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
      <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
      <span>29</span><span class="due">30</span>
    </div>
  </div>
</body>
</html>
