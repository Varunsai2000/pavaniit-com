# Netlify build settings. The site is a static export: `next build` writes plain HTML to out/.
# Security headers and caching come from out/_headers (copied from public/_headers).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # A static export needs no Next.js server runtime. Without this, Netlify's Next.js plugin
  # expects a .next server build and fails on out/.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
